server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 仅抓取前端（nginx）容器日志；后端/worker 由应用内 LokiHandler 直接推送，避免重复采集
  - job_name: frontend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/frontend'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_logstream']
        target_label: stream
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            message: message
            request_id: request_id
            logger: logger
      - labels:
          level:
          request_id:
          logger:
