name: CI

# 触发：推送 main/master/develop、v* 标签，以及对这些分支的 PR
on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# 同一分支只保留最新一次运行，取消旧的运行以节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：lint + 测试 ----------------
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost_backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          # 测试在 SQLite 降级模式 + Celery eager 下运行（conftest 也会兜底设置）
          DATABASE_URL: sqlite+aiosqlite:///./test_cost.db
          USE_LOCAL_STORAGE: "true"
          SECRET_KEY: test-secret-key
          INIT_ADMIN_USERNAME: admin
          INIT_ADMIN_PASSWORD: admin123
          MINIO_BUCKET_PATCH: cost-patch
          CELERY_TASK_ALWAYS_EAGER: "1"
          CELERY_TASK_EAGER_PROPAGATES: "1"
        run: pytest tests -q

      - name: Smoke - 历史数据迁移（验证 183MB 真实文件可入库）
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_cost.db
          USE_LOCAL_STORAGE: "true"
          SECRET_KEY: test-secret-key
          INIT_ADMIN_USERNAME: admin
          INIT_ADMIN_PASSWORD: admin123
          MINIO_BUCKET_PATCH: cost-patch
          MIGRATION_DATA_PATH: ../data/user-data.json
          CELERY_TASK_ALWAYS_EAGER: "1"
          CELERY_TASK_EAGER_PROPAGATES: "1"
        run: |
          python - <<'PY'
          import sys, json
          from fastapi.testclient import TestClient
          import main
          from core.config import settings
          settings.MIGRATION_DATA_PATH = "../data/user-data.json"
          with TestClient(main.app) as c:
              r = c.post("/api/v1/auth/login", data={"username":"admin","password":"admin123"})
              assert r.status_code == 200, r.text
              tok = r.json()["access_token"]; h={"Authorization":f"Bearer {tok}"}
              # 预览
              rp = c.get("/api/v1/migration/preview", headers=h)
              assert rp.status_code == 200, rp.text
              print("preview:", rp.json()["file_size_bytes"], "bytes")
              # 触发迁移（eager 同步完成）
              rr = c.post("/api/v1/migration/run", headers=h)
              assert rr.status_code == 200, rr.text
              jid = rr.json()["job_id"]
              rj = c.get(f"/api/v1/task/{jid}", headers=h)
              assert rj.status_code == 200, rj.text
              job = rj.json()
              assert job["status"] == "success", job
              print("migration stats:", job["result"])
              assert job["result"]["projects"] >= 1
              assert job["result"]["visas"] >= 1
              assert job["result"]["attachments"] >= 1
          print("migration smoke OK")
          PY

  # ---------------- 前端：类型检查 + 构建 ----------------
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost_web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cost_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (vue-tsc + vite)
        run: npm run build

  # ---------------- 仅 main 分支推送时构建镜像（带版本标签）----------------
  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: cost_backend
          file: cost_backend/Dockerfile
          push: false
          tags: |
            cost-backend:${{ steps.version.outputs.VERSION }}
            cost-backend:latest
            cost-backend:sha-${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: cost_web
          file: cost_web/Dockerfile
          push: false
          tags: |
            cost-web:${{ steps.version.outputs.VERSION }}
            cost-web:latest
            cost-web:sha-${{ github.sha }}

  # ---------------- 打 tag (v*) 时发布 Release（镜像 + 发布说明）----------------
  release:
    name: Release (tagged)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以生成发布说明

      - name: Resolve version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images (version-tagged)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          docker build -t "cost-backend:${VERSION}" -f cost_backend/Dockerfile cost_backend
          docker build -t "cost-worker:${VERSION}" -f cost_backend/Dockerfile cost_backend
          docker build -t "cost-flower:${VERSION}" -f cost_backend/Dockerfile cost_backend
          docker build -t "cost-web:${VERSION}" -f cost_web/Dockerfile cost_web

      - name: Generate release notes
        run: bash scripts/gen-release-notes.sh "${{ steps.version.outputs.VERSION }}" > release-notes.md

      - name: Package images as tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          docker save "cost-backend:${VERSION}" "cost-worker:${VERSION}" "cost-flower:${VERSION}" "cost-web:${VERSION}" -o "cost-images-${VERSION}.tar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            cost-images-${{ steps.version.outputs.VERSION }}.tar
            release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
