# 造价平台一站式编排
# 镜像标签由 .env 中的 IMAGE_TAG 控制（默认 latest）；DOCKER_REGISTRY 可选，用于推送私有/公共镜像仓库。
# 本地开发： docker compose up --build        # 用 build 上下文现编镜像，标签 latest
# 发布部署： IMAGE_TAG=1.0.0 docker compose up -d   # 使用已构建/拉取的版本化镜像
# 回滚：     IMAGE_TAG=0.9.0 docker compose up -d
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cost_workbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]

  backend:
    build: ./cost_backend
    image: ${DOCKER_REGISTRY:-}cost-backend:${IMAGE_TAG:-latest}
    depends_on: [db, redis, minio, loki]
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/cost_workbench
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_PATCH: cost-patch
      MINIO_BUCKET_ATTACH: cost-attach
      MINIO_SECURE: "false"
      SECRET_KEY: change-me-in-prod
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
      LOCAL_UPLOAD_DIR: /app/uploads
      LOKI_ENABLED: "true"
      LOKI_URL: http://loki:3100
      LOKI_SERVICE_NAME: cost-backend
      LOKI_ENV: prod
    volumes:
      - uploads_data:/app/uploads
    ports: ["8000:8000"]

  worker:
    build: ./cost_backend
    image: ${DOCKER_REGISTRY:-}cost-worker:${IMAGE_TAG:-latest}
    depends_on: [db, redis, minio, loki]
    command: celery -A celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/cost_workbench
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_PATCH: cost-patch
      MINIO_BUCKET_ATTACH: cost-attach
      MINIO_SECURE: "false"
      SECRET_KEY: change-me-in-prod
      LOCAL_UPLOAD_DIR: /app/uploads
      LOKI_ENABLED: "true"
      LOKI_URL: http://loki:3100
      LOKI_SERVICE_NAME: cost-worker
      LOKI_ENV: prod
    volumes:
      - uploads_data:/app/uploads

  flower:
    build: ./cost_backend
    image: ${DOCKER_REGISTRY:-}cost-flower:${IMAGE_TAG:-latest}
    depends_on: [worker, redis]
    command: celery -A celery_app.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["5555:5555"]

  frontend:
    build: ./cost_web
    image: ${DOCKER_REGISTRY:-}cost-web:${IMAGE_TAG:-latest}
    depends_on: [backend]
    ports: ["80:80"]

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    depends_on: [loki]
    ports: ["3000:3000"]

volumes:
  pg_data:
  minio_data:
  uploads_data:
  loki_data:
  grafana_data:
